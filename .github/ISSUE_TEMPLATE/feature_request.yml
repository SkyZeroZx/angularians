name: Feature request
description: Suggest something new
labels: [feature, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today, or what is hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. For something Nuxters has, link it.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: I might be able to help build it.
